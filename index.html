<style>

(function(root){

function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function win(list,from,to){
  var v=list.filter(function(x){return x.created>=from&&x.created<=to}),views=0;
  v.forEach(function(x){views+=x.views});
  return {videos:v.length,views:views,avg:v.length?Math.round(views/v.length):0};
}
/* Price-independent part: windows, activity status, whether the account can be taken at all */
function analyze(videos,now){
  now=now||Date.now();
  var d0=new Date(now);d0.setHours(0,0,0,0);
  var s=videos.slice().sort(function(a,b){return b.created-a.created});
  var total=0;s.forEach(function(v){total+=v.views});
  var A={now:now,total:{videos:s.length,views:total},
    today:win(s,d0.getTime(),now),week:win(s,now-7*DAY,now),month:win(s,now-30*DAY,now),
    lastDaysAgo:s.length?Math.floor((now-s[0].created)/DAY):null};
  var rs=0,rec=s.slice(0,10);rec.forEach(function(v){rs+=v.views});
  A.refAvg=A.month.videos?A.month.avg:(rec.length?Math.round(rs/rec.length):0);
  if(!s.length||total===0){A.status="empty";A.accepted=false;A.reject={code:"empty"};return A}
  if(A.month.videos===0){
    if(A.lastDaysAgo>120){A.status="abandoned";A.accepted=false;A.reject={code:"abandoned",n:A.lastDaysAgo};return A}
    A.status="dormant";A.accepted=true;return A;
  }
  A.status="active";A.accepted=true;return A;
}
/* Chance of approval for a given price (USD per video). cpm = price per 1000 average views. */
function evaluate(A,price){
  var r={good:[],bad:[],chance:0,decision:"no",cpm:null};
  if(!A.accepted){r.bad.push(A.reject);r.chance=A.status==="abandoned"?3:2;return r}

    if(cpm!==null&&cpm>0.12)r.bad.push({code:"price_high",c:cpm});

  }

  if(w.videos===0){ch*=0.85;r.bad.push({code:"week_none"})}

    if(w.videos>=2)r.good.push({code:"week_active",n:w.videos});

  r.chance=clamp(Math.round(ch),5,97);
  if(A.refAvg>=100000)r.good.push({code:"views_high",n:A.refAvg});
  else if(A.refAvg>=20000)r.good.push({code:"views_ok",n:A.refAvg});
  else r.bad.push({code:"views_low",n:A.refAvg});
  if(m.videos>=8)r.good.push({code:"freq_high",n:m.videos});
  else if(m.videos<=3)r.bad.push({code:"freq_low",n:m.videos});
  if(hasPrice){
    if(cpm<=0.08)r.good.push({code:"price_ok",c:cpm});
    else if(cpm>0.12)r.bad.push({code:"price_high",c:cpm});
  }
  r.decision=r.chance>=70?"take":(r.chance>=40?"maybe":"risky");

}

  var k=A.status==="dormant"?0.00002:0.00004;
  return Math.max(1,Math.min(200,Math.round(A.refAvg*k)));
}

privacy:'<p class="eyebrow">Черновик</p><h2>Политика конфиденциальности</h2><p>Проект текста для прототипа. Перед запуском его должен проверить юрист.</p>'+
'<h3>1. Какие данные мы собираем</h3><ul><li>Название аккаунта TikTok и статистика аккаунта.</li><li>Список роликов и их просмотры.</li><li>Реквизиты для выплат и переписка с поддержкой.</li></ul>'+
'<h3>2. Разрешение на анализ просмотров</h3><p>Вы подключаете аккаунт через окно разрешения TikTok. Без разрешения зарегистрироваться нельзя, потому что шанс одобрения и оплата зависят от ваших просмотров. Пароль от TikTok мы не получаем. Разрешение можно отозвать в кабинете и в настройках TikTok.</p>'+
'<h3>3. Зачем нам эти данные</h3><p>Чтобы оценить аккаунт, показать шанс одобрения, проверять выполнение условий кампании, начислять оплату и защищаться от накруток.</p>'+
'<h3>4. Кому мы передаём данные</h3><p>Платёжным провайдерам для выплат и артистам или лейблам в виде итоговой статистики кампании. Мы не продаём персональные данные.</p>'+
'<h3>5. Сроки хранения и удаление</h3><p>Данные хранятся, пока аккаунт активен и пока этого требует закон. Если автор не отправляет видео в срок, аккаунт блокируется и переносится в архив: мы больше не заказываем у него, а данные и запись о блокировке сохраняются, чтобы менеджер мог рассмотреть обращение и при необходимости разблокировать аккаунт. Сообщения чата эдиторов (последние 500) хранятся на сервере и видны менеджеру. Реквизиты для выплат хранятся в зашифрованном виде. Удалить аккаунт можно по запросу в поддержку.</p>'+
'<h3>6. Реквизиты для выплат и ответственность</h3><p>Реквизиты (PayPal, кошелёк или карту) вы вводите сами и перед сохранением подтверждаете, что они верные. Если вы указали неверный адрес или ошиблись, деньги нельзя вернуть, и это не наша ответственность. Вы всё равно обязаны выполнить заказ. Если заказ не выполнен, мы прекращаем сотрудничество навсегда.</p>'+
'<h3>7. Контакты</h3><p>[адрес поддержки будет указан здесь]</p>',
terms:'<p class="eyebrow">Черновик</p><h2>Условия использования</h2><p>Проект текста для прототипа. Перед запуском его должен проверить юрист.</p>'+
'<h3>1. Кто может участвовать</h3><p>Совершеннолетние авторы с собственным аккаунтом, который регулярно публикует видео. Пустые и давно неактивные аккаунты мы не принимаем.</p>'+
'<h3>2. Как устроены кампании</h3><p>Автор отправляет заявку на трек, менеджер проверяет аккаунт и одобряет заявку, затем автор публикует ролик со звуком кампании. На отправку ссылки отводится 16 дней. После проверки ссылки менеджером кампания считается завершённой, и выплата отправляется автору: в кабинете виден статус «оплата в пути», а после оплаты автор получает скриншот перевода.</p>'+
'<h3>3. Цена и оплата</h3><p>Автор сам выбирает цену за видео. Выплата идёт на реквизиты, сохранённые в кабинете.</p>'+
'<h3>4. Что запрещено</h3><ul><li>Накрутка просмотров и чужие аккаунты.</li><li>Оскорбления, спам, ссылки и реквизиты в чате эдиторов. Менеджер может удалить сообщение и отключить чат для нарушителя.</li><li>Контент, нарушающий правила площадки или права третьих лиц.</li></ul>'+

/* payout details */
function payFields(m){
  if(m==="paypal")return [["pf1","pay_email","email"]];
  if(m==="card")return [["pf1","pay_cardname","text"],["pf2","pay_cardnum","num"]];
  if(m==="bank")return [["pf1","pay_holder","text"],["pf2","pay_iban","text"],["pf3","pay_bankname","text"]];
  return [["pf1","pay_coin","coin"],["pf2","pay_net","net"],["pf3","pay_addr","text"],["pf4","pay_memo","opt"]];
}
function renderPay(){
  var u=S.user;if(!u)return;
  var m=S.prof.payMethod||"paypal";
  var opts=["paypal","card","bank","crypto"].map(function(k){return '<option value="'+k+'"'+(k===m?' selected':'')+'>'+esc(t("pay_"+k))+'</option>'}).join("");
  var fields=payFields(m).map(function(f){

    if(f[2]==="net")return l+'<select id="pf2">'+COINS[payCoin].map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label>';
    return l+'<input id="'+f[0]+'" type="'+(f[2]==="email"?"email":"text")+'" autocomplete="off"'+(f[2]==="num"?' inputmode="numeric"':'')+'></label>';
  }).join("");
  var bal=balance();
  var saved=S.prof.pay?'<div class="note"><b>'+esc(t("pay_saved"))+':</b> '+esc(S.prof.pay.label)+'</div>':'<div class="hint">'+esc(t("pay_none"))+'</div>';
  $("payBox").innerHTML=
    '<label class="f" for="payMethod"><span>'+esc(t("pay_method"))+'</span><select id="payMethod">'+opts+'</select></label>'+fields+
    (m==="card"?'<div class="note">'+esc(t("pay_cvv"))+'</div>':'')+
    '<div class="note err" id="payErr" hidden></div>'+
    '<div class="hint">'+esc(t("pay_warn"))+'</div>'+
    '<div><button class="btn" id="paySave">'+esc(t("pay_save"))+'</button></div>'+saved+
    '<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:14px"><div><div class="hint">'+esc(t("pay_avail"))+'</div><b style="font-family:var(--display);font-size:26px">$'+bal+'</b></div>'+
    '<button class="btn primary" id="withdraw"'+((bal<=0||!S.prof.pay)?' disabled':'')+'>'+esc(t("pay_withdraw"))+'</button></div>'+
    ((!S.prof.pay&&bal>0)?'<div class="hint">'+esc(t("pay_need"))+'</div>':(bal<=0?'<div class="hint">'+esc(t("pay_zero"))+'</div>':''));
  $("hist").innerHTML=S.history.length?S.history.slice().reverse().map(function(h){
    return '<div class="card row" style="justify-content:space-between"><div><b>$'+h.amount+'</b><div class="hint">'+esc(h.label)+' · '+fmtDate(h.at)+'</div></div><span class="pill warn">'+esc(t("pay_proc"))+'</span></div>';
  }).join(""):'<div class="empty">'+esc(t("pay_hist_none"))+'</div>';

function tail(s,k){s=String(s).replace(/\s+/g,"");return s.slice(-k)}
function head(s,k){s=String(s).replace(/\s+/g,"");return s.slice(0,k)}
function savePay(){
  var m=$("payMethod").value,f=payFields(m),v={},err=$("payErr");
  for(var i=0;i<f.length;i++){
    var val=($(f[i][0]).value||"").trim();
    if(!val&&f[i][2]!=="opt"){err.textContent=t("pay_err");err.hidden=false;return}
    v[f[i][0]]=val;
  }
  var label;
  if(m==="paypal"){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.pf1)){err.textContent=t("pay_bad");err.hidden=false;return}
    label="PayPal · "+head(v.pf1.split("@")[0],1)+"***@"+v.pf1.split("@")[1];
  }else if(m==="card"){
    var d=v.pf2.replace(/\D/g,"");
    if(d.length<13||d.length>19){err.textContent=t("pay_bad");err.hidden=false;return}
    label=t("pay_card").split(" (")[0]+" · •••• "+tail(d,4)+" · "+v.pf1;
  }else if(m==="bank"){
    if(!/^[A-Za-z0-9 ]{15,40}$/.test(v.pf2)){err.textContent=t("pay_bad");err.hidden=false;return}
    label="IBAN "+head(v.pf2,4)+"…"+tail(v.pf2,4)+" · "+v.pf1+" · "+v.pf3;
  }else{
    if(v.pf3.length<14){err.textContent=t("pay_bad");err.hidden=false;return}
    label=v.pf1+" ("+v.pf2+") · "+head(v.pf3,4)+"…"+tail(v.pf3,4)+(v.pf4?" · memo":"");
  }
  err.hidden=true;S.prof.payMethod=m;S.prof.pay={label:label};save();renderPay();
}

function route(){
  var parts=(location.hash||"#home").slice(1).split("?"),v=parts[0];
  if(parts[1]&&parts[1].indexOf("denied")>=0)$("suNote").hidden=false;
  if(parts[1]&&parts[1].indexOf("taken")>=0){$("linkErr").textContent=t("taken_err");$("linkErr").hidden=false}
  if(parts[1]&&parts[1].indexOf("mismatch")>=0){$("linkErr").textContent=t("mm_err");$("linkErr").hidden=false}
  if(VIEWS.indexOf(v)<0)v="home";
  if(LIVE){if(v==="producer")roleSet("producer");else if(["signup","dashboard","orders","pay","campaigns","analysis","report","tiktok"].indexOf(v)>=0)roleSet("editor")}
  var g=gate();
  if((v==="dashboard"||v==="report"||v==="orders"||v==="pay")&&g)v=g;
  if(v==="tiktok"&&!termsOk())v="signup";
  if(v==="analysis"&&g==="signup")v="signup";
  var sec=v;if(v==="producer")sec="lprod";else if(LIVE&&v==="home")sec="lhome";else if(LIVE&&v==="campaigns")sec="lcamps";
  document.querySelectorAll(".view").forEach(function(s){s.classList.toggle("on",s.id==="v-"+sec)});
  document.querySelectorAll("nav .lnk").forEach(function(b){b.removeAttribute("aria-current");if(b.getAttribute("data-go")===v)b.setAttribute("aria-current","page")});
  if(location.hash!=="#"+v&&(location.hash||v!=="home")){try{history.replaceState(null,"","#"+v)}catch(err){}}
  if(v==="signup"){var add=S.accounts.length>0;$("fTerms").closest("label").hidden=add;$("openTT").disabled=!termsOk();$("suTitle").textContent=add?t("acc_add_title"):t("su_title")}
  navRole();
  runId++;
  if(v==="analysis")renderAnalysis();
  if(v==="report")renderReport();
  if(v==="producer")renderLProd();
  if(LIVE&&v==="home")renderLHome();
  if(LIVE&&v==="campaigns")renderLCamps();
  if(v==="campaigns"&&!LIVE){renderChips();renderCamps()}
  if(v==="dashboard"){renderDash();if(LIVE)refreshMe().then(loadReqs).then(renderDash)}
  if(LIVE&&v==="orders"){renderOrders();refreshMe().then(loadReqs).then(renderOrders)}
  if(v==="admin")renderAdmin();
  window.scrollTo(0,0);
}

function payBoxHtml(method,amount,coin,compact){
  var x=(LV.prod&&LV.prod.pay)||{},rows=[];
  if(method==="paypal"&&x.paypal)rows.push(["PayPal",x.paypal]);
  if(method==="crypto"){var ad=(x.crypto||{})[coin||"solana"];if(ad){rows.push([coinL(coin||"solana"),ad])}}
  if(method==="card"&&x.card){if(x.cardHolder)rows.push([L("p_recipient"),x.cardHolder]);rows.push([L("p_cardno"),x.card])}
  var a=Number(amount)||0,fee=Math.round(a*0.2*100)/100;
  return '<div class="note payok"><b>'+esc(L("p_send_to"))+'</b>'+(rows.length?rows.map(function(r){return '<div class="payrow"><span class="payl">'+esc(r[0])+'</span><b class="payv">'+esc(r[1])+'</b><button type="button" class="copybtn" data-l="cpy" data-v="'+esc(r[1])+'">⧉ '+esc(L("cp_copy"))+'</button></div>'}).join(""):'<div>'+esc(L("p_no_pay"))+'</div>')+
    (compact?'':(a>0?'<div class="hotnote" style="margin-top:8px">'+esc(L("p_you_get"))+': <b>'+money(a-fee)+'</b> ('+money(a)+' − 20% = '+money(fee)+')<br><small>'+esc(L("p_fee_short"))+'</small></div>':'')+'<div class="hint" style="margin-top:6px">'+esc(L("p_fee"))+'</div>')+'</div>';
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-l]");if(!el)return;var a=el.getAttribute("data-l"),id=el.getAttribute("data-id");
  if(a==="pAdd"){
    var links={};["spotify","soundcloud","tiktok","mp3"].forEach(function(k){var v=val("nl_"+k);if(v)links[k]=v});
    var b={title:val("nTitle"),artist:val("nArtist"),links:links,budget:Number(val("nBudget")),method:val("nMethod"),coin:val("nCoin"),categories:checked("nCats"),otherCategory:val("nOther"),platforms:checked("nPlat"),descRule:!!($("nDesc")&&$("nDesc").checked),descText:val("nDescText"),instagram:val("nInsta"),tiktok:val("nTik"),discord:val("nDisc"),message:val("nMsg"),deadline:val("nDeadline")};
    var ne=$("nErr");function bad(m){ne.textContent=m;ne.hidden=false}
    if(!b.title){bad(L("p_bad"));return}
    if(!b.instagram.trim()){bad(L("ig_need"));return}
    if(b.descRule&&!b.descText.trim()){bad(L("desc_txt_need"));return}
    if(!(b.budget>=100)){bad(L("p_min100"));return}
    var badL=Object.keys(links).some(function(k){return !/^https?:\/\/\S+\.\S+/i.test(links[k])});
    var mf=$("nMp3")&&$("nMp3").files&&$("nMp3").files[0];
    var pl=b.platforms.length?b.platforms:["tiktok"];
    if(badL){bad(L("p_bad_link"));return}
    if(pl.indexOf("tiktok")>=0&&!links.tiktok){bad(L("p_tt_need"));return}
    if(pl.indexOf("instagram")>=0&&!val("nl_instagram")){bad(L("p_ig_need"));return}
    if(pl.indexOf("youtube")>=0&&!val("nl_youtube")){bad(L("p_yt_need"));return}
    if(mf&&mf.size>8*1024*1024){bad(L("p_mp3_big"));return}
    b.willUpload=!!mf;ne.hidden=true;
    var pf=$("nProof")&&$("nProof").files&&$("nProof").files[0];
    api("/api/producer/track",b).then(function(r){
      if(!r.ok){bad((r.j&&r.j.error)||L("p_err"));return}
      LV.prod=r.j;
      var mine=r.j.tracks.slice().sort(function(x,y){return (y.created||0)-(x.created||0)})[0];
      function stepMp3(){
        if(!mf)return Promise.resolve();
        return fetch("/api/producer/mp3?id="+encodeURIComponent(mine.id),{method:"POST",credentials:"same-origin",headers:{"Content-Type":"audio/mpeg"},body:mf}).then(function(x){return x.json().then(function(j){if(x.ok)LV.prod=j})});
      }
      function stepProof(){
        if(!pf||!mine.topups||!mine.topups[0])return Promise.resolve();
        return new Promise(function(res){proofFile(pf,function(img){if(!img){res();return}api("/api/producer/proof",{id:mine.topups[0].id,image:img}).then(function(u){if(u.ok)LV.prod=u.j;res()})})});
      }

function clamp01(v){return Math.max(0,Math.min(1,v))}
function breakdown(A,u){
  var vids=((u&&u.videos)||[]).filter(function(v){return v.created>=Date.now()-30*86400000}).sort(function(a,b){return a.created-b.created}).slice(-30);
  var perWeek=Math.floor(A.month.videos/(30/7)+1e-9),avg=A.refAvg||0;
  var above=vids.length?vids.filter(function(v){return v.views>=10000}).length/vids.length:0;
  var tv=0,tl=0,hasL=false;vids.forEach(function(v){tv+=v.views;if(v.likes!=null&&v.likes>0)hasL=true;tl+=v.likes||0});
  var likeP=hasL&&tv?tl/tv*100:null,price=u&&u.price,cpm=price&&avg?price/avg*1000:null;
  var parts=[
    {k:"cr_views",w:30,v:clamp01(Math.log(Math.max(avg,1)/1000)/Math.log(30)),txt:n(avg)},
    {k:"cr_stable",w:27,v:above,txt:Math.round(above*100)+"% ≥ 10K"},
    {k:"cr_price",w:21,v:cpm===null?0.5:clamp01((0.15-cpm)/0.11),txt:cpm===null?"—":"$"+cpm.toFixed(2)+" / 1K"},
    {k:"cr_freq",w:12,v:clamp01(Math.max(perWeek,A.month.videos>0?0.5:0)/7),txt:(perWeek<1&&A.month.videos>0?"<1":perWeek)+" / "+L("an_week")},
    {k:"cr_fresh",w:10,v:A.lastDaysAgo===null?0:clamp01(1-A.lastDaysAgo/7),txt:A.lastDaysAgo===null?"—":(A.lastDaysAgo===0?L("an_today"):L("an_ago").replace("{n}",A.lastDaysAgo))}];
  var score=Math.round(parts.reduce(function(s,p){return s+p.w*p.v},0));
  return {vids:vids,perWeek:perWeek,avg:avg,likeP:likeP,parts:parts,score:score};
}

function tickCd(){
  document.querySelectorAll(".cdbox").forEach(function(b){
    var ms=Number(b.getAttribute("data-end"))-Date.now(),ov=ms<=0;if(ov)ms=0;
    var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3),v={d:d,h:p2(h),m:p2(m),s:p2(s)};
    ["d","h","m","s"].forEach(function(k){var e=b.querySelector('[data-p="'+k+'"]');if(e&&e.textContent!==String(v[k]))e.textContent=v[k]});
    b.classList.toggle("low",!ov&&ms<2*864e5);b.classList.toggle("over",ov);var o=b.querySelector(".cdover");if(o)o.hidden=!ov;
  });
}

function deadlineDays(s){
  s=String(s||"").trim().toLowerCase();if(!s)return null;
  var d=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/),e=s.match(/^(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?$/),dt=null;
  if(d)dt=new Date(+d[1],+d[2]-1,+d[3]);else if(e){var y=e[3]?(+e[3]<100?2000+ +e[3]:+e[3]):new Date().getFullYear();dt=new Date(y,+e[2]-1,+e[1]);if(!e[3]&&dt<new Date())dt=new Date(y+1,+e[2]-1,+e[1])}
  if(dt&&!isNaN(dt))return (dt-Date.now())/86400000;
  var m=s.match(/(\d+(?:[.,]\d+)?)?\s*(week|нед|month|мес|year|год|лет|hour|час|hr|day|сут|д(?:ень|ня|ней|н))/);

  return q*k;
}

function dockItems(){

function dockRender(){
  var h=(location.hash||"#home").replace(/\?.*/,""),items=dockItems(),d=$("dock");
  document.body.classList.toggle("isadmin",h==="#admin");
  if(!items){document.body.classList.remove("hasdock");if(d)d.hidden=true;return}
  if(!d){d=document.createElement("nav");d.id="dock";d.setAttribute("aria-label","Menu");document.body.appendChild(d)}
  d.hidden=false;document.body.classList.add("hasdock");
  var cur=h.slice(1);
  d.innerHTML=items.map(function(it){
    var on=it[0]===cur&&((it[3]==="pay")===!!LV.dockPay)&&it[3]!=="sw"&&it[3]!=="add"&&it[3]!=="sup"&&it[3]!=="chat";
    return '<button type="button" data-dk="'+it[0]+'" data-x="'+it[3]+'"'+(on?' aria-current="page"':'')+(it[3]==="sw"?' class="dksw"':(it[3]==="sup"?' class="dkd"':''))+'><i>'+it[1]+'</i><span>'+esc(it[2])+'</span></button>'}).join("");
  var sw=d.querySelector(".dksw");if(sw){var sp=document.createElement("span");sp.className="dkx";d.insertBefore(sp,sw)}
}

ans:["Як отримати гроші? Після того як ви опублікуєте відео й менеджер їх прийме, замовлення стає «Виконано». Далі менеджер платить на збережені вами реквізити: Акаунти → ваш акаунт → «Куди ми надсилаємо ваші гроші». Переконайтеся, що вони збережені.","Ціна за відео: Акаунти → відкрийте акаунт → «Ціна за відео» → «Змінити ціну». Нова ціна йде менеджеру на розгляд; до цього діє стара.","Менеджер перевіряє нові акаунти, зазвичай протягом дня. Поки акаунт на перевірці, можна дивитися кампанії, але не брати замовлення. Статус видно в картці акаунта.","На публікацію є 16 днів з моменту схвалення. Ми надсилаємо нагадування, а в останній день — попередження. Якщо відео не надіслати вчасно, ми припиняємо працювати з акаунтом.","Теми: Акаунти → відкрийте акаунт → «Теми контенту» → позначте потрібні → «Зберегти».","Знижки: Акаунти → відкрийте акаунт → «Знижки за обсяг» → виберіть готову або свою → «Зберегти знижки». Поки не збережете, нічого не пропонується.","Як узяти трек: Замовлення → «Знайти» → виберіть трек → «Надіслати заявку». Коли менеджер схвалить, замовлення зʼявиться у «Схвалені».","Після схвалення: додайте звук треку, гучність треку 10 %, оригінал 100 %, а в описі напишіть те, що просив продюсер (воно вказане в замовленні). Потім надішліть посилання на відео.","Акаунт можна видалити лише тоді, коли немає відкритих замовлень: Акаунти → відкрийте акаунт → внизу «Видалити цей акаунт».","«Про цей акаунт» — 3–8 слів про те, що ви знімаєте. Менеджери читають це під час перевірки.","Якщо TikTok показує помилку під час підключення, напишіть менеджеру: можливо, ваш акаунт ще треба додати до списку доступу.","Способи виплати: PayPal, крипто або картка (UA). Виберіть і збережіть: Акаунти → ваш акаунт → «Куди ми надсилаємо ваші гроші». У кожного акаунта свої реквізити."]},
de:{chips:["Wie werde ich bezahlt?","Wie ändere ich meinen Preis?","Wie viele Tage für Videos?","Wie nehme ich einen Track an?"],

ans:["Wie werde ich bezahlt? Nachdem du die Videos veröffentlicht hast und der Manager sie akzeptiert, wird der Auftrag „Abgeschlossen“. Dann zahlt der Manager an die von dir gespeicherten Daten: Konten → dein Konto → „Wohin wir dein Geld senden“. Achte darauf, dass sie gespeichert sind.","Preis pro Video: Konten → Konto öffnen → „Preis pro Video“ → „Preis ändern“. Ein neuer Preis geht zur Prüfung an den Manager; bis dahin gilt der alte.","Der Manager prüft neue Konten, meist innerhalb eines Tages. Solange ein Konto in Prüfung ist, kannst du Kampagnen ansehen, aber keine Aufträge annehmen. Der Status steht auf der Kontokarte.","Du hast 16 Tage ab der Genehmigung zum Veröffentlichen. Wir senden Erinnerungen und am letzten Tag eine Warnung. Werden die Videos nicht rechtzeitig gesendet, arbeiten wir nicht mehr mit dem Konto zusammen.","Themen: Konten → Konto öffnen → „Content-Themen“ → anhaken → Speichern.","Mengenrabatte: Konten → Konto öffnen → „Mengenrabatte“ → fertigen Deal wählen oder eigenen erstellen → „Deals speichern“. Bis zum Speichern wird nichts angeboten.","So nimmst du einen Track an: Aufträge → Suchen → Track wählen → Anfrage senden. Sobald der Manager genehmigt, erscheint der Auftrag unter „Genehmigt“.","Nach der Genehmigung: Tracksound hinzufügen, Tracklautstärke 10 %, Original 100 % und in die Beschreibung schreiben, was der Produzent verlangt hat (steht im Auftrag). Dann die Videolinks senden.","Ein Konto kann nur gelöscht werden, wenn es keine offenen Aufträge hat: Konten → Konto öffnen → unten „Dieses Konto löschen“.","„Über dieses Konto“ sind 3–8 Wörter darüber, was du filmst. Manager lesen es bei der Prüfung.","Wenn TikTok beim Verbinden einen Fehler zeigt, schreibe dem Manager: Dein Konto muss evtl. noch zur Zugriffsliste hinzugefügt werden.","Auszahlungsmethoden: PayPal, Krypto oder Karte (UA). Wähle und speichere: Konten → dein Konto → „Wohin wir dein Geld senden“. Jedes Konto hat eigene Daten."]},
es:{chips:["¿Cómo me pagan?","¿Cómo cambio mi precio?","¿Cuántos días tengo para los vídeos?","¿Cómo acepto un tema?"],
kw:["pago|pagan|dinero|cobr","precio|cuesta|cuánto","verific|revis|aprob|estado","plazo|días|tarde|deadline","temática|nicho|categor","descuento|volumen|oferta","solicitud|pedido|tema|aceptar","sonido|volumen|descripción|vídeo|video","elimin|borrar","sobre|palabras","tiktok|conect|error","tarjeta|cripto|paypal|método|datos"],
ans:["¿Cómo me pagan? Cuando publicas los vídeos y el gestor los acepta, el pedido pasa a Completado. Luego el gestor paga a los datos que guardaste: Cuentas → tu cuenta → «Dónde enviamos tu dinero». Comprueba que estén guardados.","Precio por vídeo: Cuentas → abre la cuenta → «Precio por vídeo» → «Cambiar precio». El precio nuevo va al gestor para revisión; hasta entonces sigue el anterior.","El gestor revisa las cuentas nuevas, normalmente en un día. Mientras está en revisión puedes ver campañas pero no aceptar pedidos. El estado aparece en la tarjeta de la cuenta.","Tienes 16 días desde la aprobación para publicar. Enviamos recordatorios y un aviso el último día. Si los vídeos no se envían a tiempo, dejamos de trabajar con la cuenta.","Temáticas: Cuentas → abre la cuenta → «Temáticas de contenido» → márcalas → Guardar.","Ofertas por volumen: Cuentas → abre la cuenta → «Ofertas por volumen» → elige una lista o crea la tuya → Guardar ofertas. No se ofrece nada hasta que guardes.","Cómo aceptar un tema: Pedidos → Buscar → elige un tema → Enviar solicitud. Cuando el gestor la apruebe, el pedido aparece en Aprobados.","Tras la aprobación: añade el sonido del tema, volumen del tema 10 %, original 100 %, y escribe en la descripción lo que pidió el productor (aparece en el pedido). Luego envía los enlaces de los vídeos.","Solo puedes eliminar una cuenta si no tiene pedidos abiertos: Cuentas → abre la cuenta → abajo «Eliminar esta cuenta».","«Sobre esta cuenta» son de 3 a 8 palabras sobre lo que grabas. Los gestores lo leen en la revisión.","Si TikTok muestra un error al conectar, escribe al gestor: puede que tu cuenta aún deba añadirse a la lista de acceso.","Métodos de cobro: PayPal, cripto o tarjeta (UA). Elige y guarda: Cuentas → tu cuenta → «Dónde enviamos tu dinero». Cada cuenta tiene sus propios datos."]},
pt:{chips:["Como eu recebo?","Como altero meu preço?","Quantos dias para os vídeos?","Como aceito uma faixa?"],
kw:["pagamento|receb|dinheiro|pagar","preço|custa|quanto","verific|análise|aprov|status","prazo|dias|atras|deadline","tema|nicho|categor","desconto|volume|oferta","solicitação|pedido|faixa|aceitar","som|volume|descrição|vídeo|video","exclu|apagar|remov","sobre|palavras","tiktok|conect|erro","cartão|cripto|paypal|método|dados"],
ans:["Como eu recebo? Depois que você publica os vídeos e o gerente os aceita, o pedido fica Concluído. Então o gerente paga nos dados que você salvou: Contas → sua conta → «Para onde enviamos seu dinheiro». Confira se estão salvos.","Preço por vídeo: Contas → abra a conta → «Preço por vídeo» → «Alterar preço». O novo preço vai ao gerente para análise; até lá vale o antigo.","O gerente analisa as contas novas, geralmente em um dia. Enquanto está em análise, você pode ver campanhas mas não aceitar pedidos. O status aparece no cartão da conta.","Você tem 16 dias desde a aprovação para publicar. Enviamos lembretes e um aviso no último dia. Se os vídeos não forem enviados a tempo, paramos de trabalhar com a conta.","Temas: Contas → abra a conta → «Temas de conteúdo» → marque → Salvar.","Ofertas por volume: Contas → abra a conta → «Ofertas por volume» → escolha uma pronta ou crie a sua → Salvar ofertas. Nada é oferecido até você salvar.","Como aceitar uma faixa: Pedidos → Buscar → escolha uma faixa → Enviar solicitação. Quando o gerente aprovar, o pedido aparece em Aprovados.","Depois da aprovação: adicione o som da faixa, volume da faixa 10%, original 100%, e escreva na descrição o que o produtor pediu (aparece no pedido). Depois envie os links dos vídeos.","Só dá para excluir uma conta se ela não tiver pedidos abertos: Contas → abra a conta → embaixo «Excluir esta conta».","«Sobre esta conta» são de 3 a 8 palavras sobre o que você filma. Os gerentes leem na análise.","Se o TikTok mostrar um erro ao conectar, escreva ao gerente: sua conta pode ainda precisar entrar na lista de acesso.","Formas de receber: PayPal, cripto ou cartão (UA). Escolha e salve: Contas → sua conta → «Para onde enviamos seu dinheiro». Cada conta tem seus próprios dados."]},

ans:["Comment suis-je payé ? Après que vous avez publié les vidéos et que le gestionnaire les a acceptées, la commande passe à Terminé. Ensuite le gestionnaire paie sur les informations que vous avez enregistrées : Comptes → votre compte → « Où nous envoyons votre argent ». Vérifiez qu’elles sont enregistrées.","Prix par vidéo : Comptes → ouvrez le compte → « Prix par vidéo » → « Changer le prix ». Un nouveau prix part au gestionnaire pour vérification ; l’ancien reste valable d’ici là.","Le gestionnaire vérifie les nouveaux comptes, en général sous un jour. Pendant la vérification, vous pouvez parcourir les campagnes mais pas prendre de commandes. Le statut figure sur la carte du compte.","Vous avez 16 jours après l’approbation pour publier. Nous envoyons des rappels, et un avertissement le dernier jour. Si les vidéos ne sont pas envoyées à temps, nous cessons de travailler avec le compte.","Thèmes : Comptes → ouvrez le compte → « Thèmes de contenu » → cochez → Enregistrer.","Offres de volume : Comptes → ouvrez le compte → « Offres de volume » → choisissez une offre prête ou créez la vôtre → Enregistrer les offres. Rien n’est proposé tant que vous n’avez pas enregistré.","Comment prendre un titre : Commandes → Chercher → choisissez un titre → Envoyer une demande. Quand le gestionnaire approuve, la commande apparaît dans Approuvés.","Après l’approbation : ajoutez le son du titre, volume du titre 10 %, original 100 %, et écrivez dans la description ce que le producteur a demandé (indiqué dans la commande). Puis envoyez les liens des vidéos.","Un compte ne peut être supprimé que s’il n’a aucune commande ouverte : Comptes → ouvrez le compte → en bas « Supprimer ce compte ».","« À propos de ce compte » : 3 à 8 mots sur ce que vous filmez. Les gestionnaires le lisent lors de la vérification.","Si TikTok affiche une erreur lors de la connexion, écrivez au gestionnaire : votre compte doit peut-être encore être ajouté à la liste d’accès.","Modes de versement : PayPal, crypto ou carte (UA). Choisissez et enregistrez : Comptes → votre compte → « Où nous envoyons votre argent ». Chaque compte a ses propres informations."]},

ans:["Parayı nasıl alırım? Videoları yayınlayıp yönetici kabul ettikten sonra sipariş Tamamlandı olur. Sonra yönetici kaydettiğin bilgilere ödeme yapar: Hesaplar → hesabın → «Paranı nereye gönderiyoruz». Kayıtlı olduğundan emin ol.","Video başına fiyat: Hesaplar → hesabı aç → «Video başına fiyat» → «Fiyatı değiştir». Yeni fiyat inceleme için yöneticiye gider; o zamana kadar eski fiyat geçerlidir.","Yönetici yeni hesapları genelde bir gün içinde inceler. İncelemedeyken kampanyalara bakabilirsin ama sipariş alamazsın. Durum hesap kartında görünür.","Yayınlamak için onaydan itibaren 16 günün var. Hatırlatma gönderiyoruz, son gün de uyarı. Videolar zamanında gönderilmezse hesapla çalışmayı bırakırız.","Temalar: Hesaplar → hesabı aç → «İçerik temaları» → işaretle → Kaydet.","Toplu fırsatlar: Hesaplar → hesabı aç → «Toplu fırsatlar» → hazır birini seç veya kendin oluştur → Fırsatları kaydet. Kaydedene kadar hiçbir şey teklif edilmez.","Parça nasıl alınır: Siparişler → Ara → bir parça seç → Talep gönder. Yönetici onaylayınca sipariş Onaylanan'da görünür.","Onaydan sonra: parça sesini ekle, parça ses seviyesi %10, orijinal %100 ve açıklamaya yapımcının istediğini yaz (siparişte görünür). Sonra video bağlantılarını gönder.","Bir hesap yalnızca açık siparişi yoksa silinebilir: Hesaplar → hesabı aç → altta «Bu hesabı sil».","«Bu hesap hakkında» çektiğin içerik hakkında 3–8 kelimedir. Yöneticiler incelemede bunu okur.","TikTok bağlanırken hata gösterirse yöneticiye yaz: hesabının erişim listesine eklenmesi gerekebilir.","Ödeme yöntemleri: PayPal, kripto veya kart (UA). Seç ve kaydet: Hesaplar → hesabın → «Paranı nereye gönderiyoruz». Her hesabın kendi bilgileri var."]}

/* payments page */
function pmWay(q){return q.status==="approved"||q.status==="submitted"||q.status==="returned"||(q.status==="completed"&&!q.paid)}
function pmCard(q,i){
  var done=q.paid,comp=q.status==="completed";
  var s3=q.eta?L("pm_s3d").replace("{d}",q.eta):L("pm_s3");
  var st=[[L("pm_s1"),"done"],[L("pm_s2"),"done"],[s3,done?"done":"cur"],[L("pm_s4"),done?"done":"todo"]];
  var tl='<ol class="tl">'+st.map(function(x){return '<li class="'+x[1]+'"><span>'+esc(x[0])+'</span></li>'}).join("")+'</ol>';
  return '<div class="card pmc glow" style="animation-delay:'+Math.min(i,8)*0.05+'s"><span class="pmpill">'+esc(L("pm_pill"))+'</span><div class="t"><div><b>'+esc(q.track)+' — '+esc(q.artist)+'</b><span>#'+esc(String(q.id).slice(-5))+' · '+esc(L("pm_vid").replace("{n}",q.videos))+' · '+fmtDate(q.approvedAt||q.created)+'</span></div><b class="pmsum">'+money(q.cost)+'</b></div><span class="pmtag">'+esc(L("pm_camp"))+'</span>'+tl+'</div>';
}
function pmHist(q,i){
  return '<div class="card pmh" style="animation-delay:'+Math.min(i,8)*0.05+'s"><div class="t"><div><b>'+esc(q.track)+' — '+esc(q.artist)+'</b><span>#'+esc(String(q.id).slice(-5))+' · '+esc(L("pm_vid").replace("{n}",q.videos))+'</span></div><b class="pmsum">'+money(q.cost)+'</b></div>'+
    '<div class="pmrow"><span class="rcpill ok">✅ '+esc(L("pm_paid"))+'</span><small>'+esc(L("pm_sent").replace("{d}",fmtDate(q.paidAt||q.created)))+'</small></div>'+
    '<div class="row"><button type="button" class="btn sm rcb'+(q.accepted?' acc':'')+'" data-l="rcOpen" data-id="'+esc(q.id)+'">🧾 '+esc(L("pm_inv"))+'</button>'+(q.hasProof?'<button type="button" class="btn sm" data-l="showProof" data-id="'+esc(q.id)+'">📎 '+esc(L("pm_proof"))+'</button>':'')+(q.accepted?'<span class="rcok">✓ '+esc(L("pm_acc"))+'</span>':'')+'</div></div>';
}
function renderPay(){
  var host=$("payPageBody");if(!host)return;
  var all=(LV.reqs||[]).slice().sort(function(a,b){return (b.paidAt||b.created)-(a.paidAt||a.created)});
  var way=all.filter(pmWay),hist=all.filter(function(q){return q.paid});
  host.innerHTML='<h2>'+esc(L("pm_title"))+'</h2><h3 class="sub">'+esc(L("pm_way"))+' · '+way.length+'</h3><p class="hint">'+esc(L("pm_way_h"))+'</p>'+
    (way.length?way.map(pmCard).join(""):'<div class="empty">'+esc(L("pm_none"))+'</div>')+
    '<h3 class="sub">'+esc(L("pm_hist"))+'</h3>'+(hist.length?hist.map(pmHist).join(""):'<div class="empty">'+esc(L("pm_hist_none"))+'</div>');
}

/* v43: resilient network (Render cold start / flaky mobile), friendly 401 in chat */
(function(){
  var raw=window.fetch?window.fetch.bind(window):null;
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
  if(raw){
    window.fetch=function(u,o){
      var m=((o&&o.method)||"GET").toUpperCase(),local=typeof u==="string"&&u.charAt(0)==="/";
      if(!local)return raw(u,o);
      var tries=0,max=m==="GET"?4:3;
      function go1(){
        return raw(u,o).then(function(r){
          if((r.status===502||r.status===503||r.status===504)&&tries<max-1){tries++;return wait(1200*tries).then(go1)}
          return r;
        },function(err){
          if(m==="GET"&&tries<max-1){tries++;return wait(1200*tries).then(go1)}
          throw err;
        });
      }
      return go1();
    };
  }
  var N={en:{ch_exp:"Your session ended. Sign in again to use the chat.",ch_login:"Sign in",ch_wake:"The server is waking up, one moment…"},
    ru:{ch_exp:"Сессия закончилась. Войдите заново, чтобы пользоваться чатом.",ch_login:"Войти",ch_wake:"Сервер просыпается, секунду…"}};
  Object.assign(LT.en,N.en);Object.assign(LT.ru,N.ru);
  ["uk","de","es","pt","fr","tr"].forEach(function(k){XLL[k]=XLL[k]||{};XLL[k].ch_exp=XLL[k].ch_exp||N.en.ch_exp;XLL[k].ch_login=XLL[k].ch_login||N.en.ch_login;XLL[k].ch_wake=XLL[k].ch_wake||N.en.ch_wake});
  var fails=0;
  chDown=function(code){
    var f=$("chatForm");if(!f)return;
    if(code===401){f.innerHTML='<div class="note err chdown">'+esc(L("ch_exp"))+'</div><div class="row"><button class="btn primary" id="chRe">'+esc(L("ch_login"))+'</button></div>';return}
    fails++;
    if(fails<3){f.innerHTML='<div class="note chdown">'+esc(L("ch_wake"))+'</div>';return}
    f.innerHTML='<div class="note err chdown">'+esc(L("ch_down"))+(code?' ('+code+')':'')+'</div><div class="row"><button class="btn primary" data-l="chRetry">'+esc(L("ch_retry"))+'</button></div>';
  };
  document.addEventListener("click",function(e){var t=e.target;if(t&&t.id==="chRe"){closeChat();try{localStorage.removeItem("pc_role")}catch(x){}location.hash="signup"}});
  /* pause chat polling while the tab is hidden */
  var op=chPoll;chPoll=function(){if(document.hidden)return;op()};var orr=chRender;chRender=function(j){fails=0;return orr(j)};
})();
