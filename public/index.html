<title>Promo Campaign</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Cpath%20d=%22M32%200A32%2032%200%200%201%2064%2032A32%2032%200%200%201%2032%2064H20A20%2020%200%200%201%200%2044V32A32%2032%200%200%201%2032%200Z%22%20fill=%22%23FF5C80%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2232%22%20r=%2212.5%22%20fill=%22%230E1020%22/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="/icon.png"><meta name="theme-color" content="#0E1020">

<style>
/* Layout: sticky top bar, one view per hash route; onboarding is a linear flow (TikTok connect, analysis, report) before catalog, dashboard and the manager screen */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --fg:#12152B; --muted:#5B6180; --line:#DDE1EE;
  --accent:#E8365D; --accent-fg:#FFFFFF; --soft:#ECEFF8; --ok:#1E8E5A; --warn:#A8670F; --bad:#C62839;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --surface:#171A30; --fg:#EEF0FA; --muted:#9AA0C0; --line:#2A2E4A;
  --accent:#FF5C80; --accent-fg:#1A0710; --soft:#1D2140; --ok:#4CD08F; --warn:#E6B04F; --bad:#FF7A88; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --surface:#171A30; --fg:#EEF0FA; --muted:#9AA0C0; --line:#2A2E4A;
  --accent:#FF5C80; --accent-fg:#1A0710; --soft:#1D2140; --ok:#4CD08F; --warn:#E6B04F; --bad:#FF7A88; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(34px,6vw,58px);font-weight:700}
h2{font-size:clamp(24px,3.6vw,34px);font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:19px;margin-right:auto;background:none;border:0;padding:0;cursor:pointer}
.mark{width:26px;height:26px;border-radius:50% 50% 50% 8px;background:var(--accent);position:relative}
.mark::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.lnk:hover,.lnk[aria-current="page"]{color:var(--fg);background:var(--soft)}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.wide{width:100%}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.view{display:none;padding-top:40px}
.view.on{display:block}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:24px 0 56px}
.hero p.lead{font-size:18px;color:var(--muted);margin:18px 0 26px;max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.stack{position:relative;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.stack .card.back{position:absolute;inset:14px -10px -14px 14px;background:var(--soft);z-index:0}
.stack .card.front{position:relative;z-index:1;display:grid;gap:12px}
.sec{padding:40px 0;border-top:1px solid var(--line)}
.sec>h2{margin-bottom:22px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px;margin-bottom:10px}
.steps h3{margin-bottom:6px;font-size:16px}
.steps p{color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.facts .card h3{margin-bottom:6px}
.facts p{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.camp{display:grid;gap:12px;align-content:start}
.camp .top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.camp .name{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.15}
.camp .by{color:var(--muted);font-size:14px}
.price{font-family:var(--display);font-size:24px;font-weight:700;white-space:nowrap}
.price small{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:500}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.meter div{min-width:0}
.meter b{display:block;font-variant-numeric:tabular-nums;font-size:16px}
.meter span{font-size:12px;color:var(--muted)}
.narrow{max-width:560px}
.form{display:grid;gap:14px;margin-top:20px}
label.f{display:grid;gap:5px;font-weight:500;font-size:14px}
input[type=text],input[type=email],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input,.opt input{margin-top:4px;accent-color:var(--accent)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.note{border-radius:10px;padding:11px 13px;font-size:14px;background:var(--soft)}
.note.err{color:var(--bad);border:1px solid var(--bad);background:transparent}
.inl{padding:0;text-decoration:underline}
.flow{display:flex;gap:6px;margin-bottom:22px}
.flow i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.flow i.on{background:var(--accent)}
.tt{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;margin-top:18px}
.tt .hd{padding:14px 18px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600}
.tt .bd{padding:18px;display:grid;gap:14px}
.tt ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.prog{list-style:none;padding:0;margin:20px 0;display:grid;gap:10px}
.prog li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.prog li.done{color:var(--fg)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.prog li.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.prog li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child{font-weight:600}
.pricebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pricebox input{width:130px;font-family:var(--display);font-size:24px;font-weight:700}
.big{font-family:var(--display);font-size:clamp(56px,14vw,84px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.gauge{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}
.gauge i{display:block;height:100%;background:var(--ok);border-radius:99px}
.gauge.mid i{background:var(--warn)}
.gauge.low i{background:var(--bad)}
.rs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.rs li{display:flex;gap:10px;font-size:14px}
.rs li::before{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.rs.g li::before{content:"✓";background:var(--ok);color:var(--bg)}
.rs.b li::before{content:"×";background:var(--bad);color:var(--bg)}
.blk{display:grid;gap:6px;padding:16px 0;border-top:1px solid var(--line)}
.blk>h3{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
.tile b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.list{display:grid;gap:10px}
.ord{display:grid;gap:10px}
.ord .t{display:flex;gap:10px;justify-content:space-between;align-items:start;flex-wrap:wrap}
.ord .t b{font-family:var(--display);font-size:18px;display:block}
.ord .t span{color:var(--muted);font-size:13px}
.ord .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.ord .kv div{min-width:0}
.ord .kv b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.ord .kv span{font-size:12px;color:var(--muted)}
.sub{margin:30px 0 12px}
.pay{display:grid;gap:14px}
.doc{max-width:720px}
.doc h2{margin-bottom:6px}
.doc h3{margin:26px 0 6px}
.doc p,.doc li{color:var(--muted)}
.doc ul{padding-left:20px;margin:6px 0}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
footer button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:13px}
.proto{background:var(--soft);color:var(--muted);font-size:12px;text-align:center;padding:6px 10px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:12px}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:34px}
  .steps{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){.steps{grid-template-columns:1fr}.ord .kv{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- live screens: roles, producer, tracks, owner cabinet ---- */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.role{text-align:left;cursor:pointer;display:grid;gap:8px;font:inherit;color:inherit;padding:22px}
.role b{font-family:var(--display);font-size:24px}
.role span:not(.pill){color:var(--muted);font-size:14px}
.role:hover{border-color:var(--accent)}
.hero1{padding:28px 0 8px;max-width:720px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.cats label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;background:var(--surface)}
.cats input{accent-color:var(--accent)}
.cats label.dis,.accopt.dis{opacity:.45;cursor:not-allowed}
.mbg{position:fixed;inset:0;background:rgba(10,12,24,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;display:grid;gap:14px}
.accopt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.accopt input{margin-top:4px;accent-color:var(--accent)}
.gold{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#E8B93B;color:#2A1F00}
.stars{font-weight:700;color:#C9961A;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.arow summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.arow summary>*{min-width:0}
.arow{padding:14px 16px}
@media (max-width:640px){.roles{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr}}
.role .pill{align-self:flex-start}
.tile.hot{background:rgba(232,193,90,.18);border-color:rgba(201,150,26,.65)}.tile.hot b{color:#B07F0A}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile.hot b{color:#F1C75B}}:root[data-theme="dark"] .tile.hot b{color:#F1C75B}.tile select{margin-top:8px;max-width:100%;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.tl{list-style:none;margin:14px 0 4px;padding:0}
.tl li{position:relative;padding:0 0 14px 28px;font-size:14px;color:var(--muted)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--line);box-sizing:border-box}
.tl li::after{content:"";position:absolute;left:10px;top:19px;bottom:-3px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--fg)}.tl li.done::before{background:#1FA85A;border-color:#1FA85A}.tl li.done::after{background:#1FA85A}
.tl li.cur{color:var(--fg);font-weight:600}.tl li.cur::before{background:#E8A91E;border-color:#E8A91E;animation:pulseDot 1.6s ease-in-out infinite}
.tl small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(232,169,30,.5)}50%{box-shadow:0 0 0 7px rgba(232,169,30,0)}}
.lang{display:flex;align-items:center;gap:8px}.langL{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}@media (max-width:560px){.langL{display:none}}
.hotnote{background:rgba(232,193,90,.22);border:1px solid rgba(201,150,26,.65);border-radius:10px;padding:10px 12px;font-weight:600}
.cats label.soon{opacity:.45;cursor:not-allowed}
.v-green{border-color:#1FA85A!important;background:rgba(31,168,90,.09)}.v-yellow{border-color:#E8A91E!important;background:rgba(232,169,30,.12)}.v-red{border-color:#D8445A!important;background:rgba(216,68,90,.08)}
.vbadge{font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px;color:#fff}.vbadge.v-green{background:#1FA85A}.vbadge.v-yellow{background:#C98A0C}.vbadge.v-red{background:#D8445A}
.stepsx{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;overflow:hidden}
.stbar{height:6px;border-radius:999px;background:rgba(127,127,127,.2);overflow:hidden}.stbar i{display:block;height:100%;background:linear-gradient(90deg,#7C5CFF,#1FA85A);border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1);animation:grow 1.1s cubic-bezier(.2,.8,.2,1)}
.st{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid rgba(127,127,127,.25);cursor:pointer;opacity:0;animation:stIn .6s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .2s,box-shadow .2s,border-color .2s}

.chk-ed{background:#2F7BFF!important;color:#fff!important;border-color:#2F7BFF!important}.chk-pr{background:#1FA85A!important;color:#fff!important;border-color:#1FA85A!important}.chk-demo{background:#E8A91E!important;color:#1a1a1a!important;border-color:#E8A91E!important}
.ctfloat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;justify-items:end}
.ctfloat #ctBox{background:var(--surface);color:var(--fg);border:1px solid rgba(127,127,127,.3);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;gap:8px;animation:popIn .3s both}
.ct-tg{background:#27A7E7!important;color:#fff!important}.ct-dc{background:#5865F2!important;color:#fff!important}
.flow.lab{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flow.lab .fs{display:grid;gap:6px;align-content:start;opacity:.55;transition:opacity .3s}.flow.lab .fs.on{opacity:1}
.flow.lab .fs i{height:5px;flex:none;width:100%;border-radius:4px;background:var(--line);transition:background .5s}.flow.lab .fs.on i{background:var(--accent)}
.flow.lab .fs.cur i{animation:pulseBar 1.6s ease-in-out infinite}
.flow.lab .fs b{font-size:14px}.flow.lab .fs small{color:var(--muted);font-size:12.5px;line-height:1.35}

/* Account scoring for Promo Campaign. Input: list of videos {created (ms), views}. Works in Node and in the browser. */
(function(root){
var DAY=86400000;
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function win(list,from,to){
  var v=list.filter(function(x){return x.created>=from&&x.created<=to}),views=0;
  v.forEach(function(x){views+=x.views});
  return {videos:v.length,views:views,avg:v.length?Math.round(views/v.length):0};
}
/* Price-independent part: windows, activity status, whether the account can be taken at all */
function analyze(videos,now){
  now=now||Date.now();
  var d0=new Date(now);d0.setHours(0,0,0,0);
  var s=videos.slice().sort(function(a,b){return b.created-a.created});
  var total=0;s.forEach(function(v){total+=v.views});
  var A={now:now,total:{videos:s.length,views:total},
    today:win(s,d0.getTime(),now),week:win(s,now-7*DAY,now),month:win(s,now-30*DAY,now),
    lastDaysAgo:s.length?Math.floor((now-s[0].created)/DAY):null};
  var rs=0,rec=s.slice(0,10);rec.forEach(function(v){rs+=v.views});
  A.refAvg=A.month.videos?A.month.avg:(rec.length?Math.round(rs/rec.length):0);
  if(!s.length||total===0){A.status="empty";A.accepted=false;A.reject={code:"empty"};return A}
  if(A.month.videos===0){
    if(A.lastDaysAgo>120){A.status="abandoned";A.accepted=false;A.reject={code:"abandoned",n:A.lastDaysAgo};return A}
    A.status="dormant";A.accepted=true;return A;
  }
  A.status="active";A.accepted=true;return A;
}
/* Chance of approval for a given price (USD per video). cpm = price per 1000 average views. */
function evaluate(A,price){
  var r={good:[],bad:[],chance:0,decision:"no",cpm:null};
  if(!A.accepted){r.bad.push(A.reject);return r}
  var hasPrice=price>0&&A.refAvg>0;
  var cpm=hasPrice?price/A.refAvg*1000:null;r.cpm=cpm;
  if(A.status==="dormant"){
    r.chance=(cpm!==null&&cpm>0.12)?9:17;
    r.bad.push({code:"no_month"});r.bad.push({code:"last_old",n:A.lastDaysAgo});
    if(cpm!==null&&cpm>0.12)r.bad.push({code:"price_high",c:cpm});
    r.decision="risky";return r;
  }
  var m=A.month,w=A.week;
  var V=clamp(Math.log(Math.max(A.refAvg,1)/1000)/Math.log(300),0,1);
  var F=m.videos>=8?1:(m.videos>=4?0.8:(m.videos>=2?0.6:0.35));
  var P=hasPrice?clamp(1-(cpm-0.05)/0.15,0,1):0.6;
  var score=0.45*V+0.25*F+0.30*P;
  var ch=score*97;
  if(w.videos===0){ch*=0.85;r.bad.push({code:"week_none"})}
  else{
    if(w.videos>=2)r.good.push({code:"week_active",n:w.videos});
    if(m.avg>0&&w.avg>=1.2*m.avg){ch+=3;r.good.push({code:"growing"})}
    else if(m.avg>0&&w.avg<0.5*m.avg){ch-=4;r.bad.push({code:"dropping"})}
  }
  if(A.refAvg<1000)ch=Math.min(ch,25);
  r.chance=clamp(Math.round(ch),5,97);
  if(A.refAvg>=100000)r.good.push({code:"views_high",n:A.refAvg});
  else if(A.refAvg>=20000)r.good.push({code:"views_ok",n:A.refAvg});
  else r.bad.push({code:"views_low",n:A.refAvg});
  if(m.videos>=8)r.good.push({code:"freq_high",n:m.videos});
  else if(m.videos<=3)r.bad.push({code:"freq_low",n:m.videos});
  if(hasPrice){
    if(cpm<=0.08)r.good.push({code:"price_ok",c:cpm});
    else if(cpm>0.12)r.bad.push({code:"price_high",c:cpm});
  }
  r.decision=r.chance>=70?"take":(r.chance>=40?"maybe":"risky");
  return r;
}
/* Price the site proposes automatically: low relative to the 30-day average views, so the approval chance stays high */
function recommend(A){
  if(!A.accepted)return null;
  var k=A.status==="dormant"?0.00002:0.00004;
  return Math.max(1,Math.min(200,Math.round(A.refAvg*k)));
}

privacy:'<p class="eyebrow">Черновик</p><h2>Политика конфиденциальности</h2><p>Проект текста для прототипа. Перед запуском его должен проверить юрист.</p>'+
'<h3>1. Какие данные мы собираем</h3><ul><li>Название аккаунта TikTok и статистика аккаунта.</li><li>Список роликов и их просмотры.</li><li>Реквизиты для выплат и переписка с поддержкой.</li></ul>'+
'<h3>2. Разрешение на анализ просмотров</h3><p>Вы подключаете аккаунт через окно разрешения TikTok. Без разрешения зарегистрироваться нельзя, потому что шанс одобрения и оплата зависят от ваших просмотров. Пароль от TikTok мы не получаем. Разрешение можно отозвать в кабинете и в настройках TikTok.</p>'+
'<h3>3. Зачем нам эти данные</h3><p>Чтобы оценить аккаунт, показать шанс одобрения, проверять выполнение условий кампании, начислять оплату и защищаться от накруток.</p>'+
'<h3>4. Кому мы передаём данные</h3><p>Платёжным провайдерам для выплат и артистам или лейблам в виде итоговой статистики кампании. Мы не продаём персональные данные.</p>'+
'<h3>5. Сроки хранения и удаление</h3><p>Данные хранятся, пока аккаунт активен и пока этого требует закон. Если автор не отправляет видео в срок, аккаунт блокируется, мы больше не заказываем у него, а запись о блокировке сохраняется. Реквизиты для выплат хранятся в зашифрованном виде. Удалить аккаунт можно по запросу в поддержку.</p>'+

active:{last:0.3,count:45,gap:1,avg:200000,seed:1},

function genVideos(key,now){
  var c=SCN[key],s=c.seed,out=[];
  function r(){s=(s*1664525+1013904223)>>>0;return s/4294967296}
  for(var i=0;i<c.count;i++){out.push({created:Math.round(now-(c.last+i*c.gap)*DAY*(0.85+0.3*r())),views:Math.round(c.avg*(0.4+1.6*r()))})}
  return out;
}

/* payout details */
function payFields(m){
  if(m==="paypal")return [["pf1","pay_email","email"]];
  if(m==="card")return [["pf1","pay_cardname","text"],["pf2","pay_cardnum","num"]];
  if(m==="bank")return [["pf1","pay_holder","text"],["pf2","pay_iban","text"],["pf3","pay_bankname","text"]];
  return [["pf1","pay_coin","coin"],["pf2","pay_net","net"],["pf3","pay_addr","text"],["pf4","pay_memo","opt"]];
}
function renderPay(){
  var u=S.user;if(!u)return;
  var m=S.prof.payMethod||"paypal";
  var opts=["paypal","card","bank","crypto"].map(function(k){return '<option value="'+k+'"'+(k===m?' selected':'')+'>'+esc(t("pay_"+k))+'</option>'}).join("");
  var fields=payFields(m).map(function(f){
    var l='<label class="f" for="'+f[0]+'"><span>'+esc(t(f[1]))+'</span>';
    if(f[2]==="coin")return l+'<select id="pf1">'+Object.keys(COINS).map(function(c){return '<option'+(c===payCoin?' selected':'')+'>'+c+'</option>'}).join("")+'</select></label>';
    if(f[2]==="net")return l+'<select id="pf2">'+COINS[payCoin].map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label>';
    return l+'<input id="'+f[0]+'" type="'+(f[2]==="email"?"email":"text")+'" autocomplete="off"'+(f[2]==="num"?' inputmode="numeric"':'')+'></label>';
  }).join("");
  var bal=balance();
  var saved=S.prof.pay?'<div class="note"><b>'+esc(t("pay_saved"))+':</b> '+esc(S.prof.pay.label)+'</div>':'<div class="hint">'+esc(t("pay_none"))+'</div>';
  $("payBox").innerHTML=
    '<label class="f" for="payMethod"><span>'+esc(t("pay_method"))+'</span><select id="payMethod">'+opts+'</select></label>'+fields+
    (m==="card"?'<div class="note">'+esc(t("pay_cvv"))+'</div>':'')+
    '<div class="note err" id="payErr" hidden></div>'+
    '<div class="hint">'+esc(t("pay_warn"))+'</div>'+
    '<div><button class="btn" id="paySave">'+esc(t("pay_save"))+'</button></div>'+saved+
    '<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:14px"><div><div class="hint">'+esc(t("pay_avail"))+'</div><b style="font-family:var(--display);font-size:26px">$'+bal+'</b></div>'+
    '<button class="btn primary" id="withdraw"'+((bal<=0||!S.prof.pay)?' disabled':'')+'>'+esc(t("pay_withdraw"))+'</button></div>'+
    ((!S.prof.pay&&bal>0)?'<div class="hint">'+esc(t("pay_need"))+'</div>':(bal<=0?'<div class="hint">'+esc(t("pay_zero"))+'</div>':''));
  $("hist").innerHTML=S.history.length?S.history.slice().reverse().map(function(h){
    return '<div class="card row" style="justify-content:space-between"><div><b>$'+h.amount+'</b><div class="hint">'+esc(h.label)+' · '+fmtDate(h.at)+'</div></div><span class="pill warn">'+esc(t("pay_proc"))+'</span></div>';
  }).join(""):'<div class="empty">'+esc(t("pay_hist_none"))+'</div>';
}
function tail(s,k){s=String(s).replace(/\s+/g,"");return s.slice(-k)}
function head(s,k){s=String(s).replace(/\s+/g,"");return s.slice(0,k)}
function savePay(){
  var m=$("payMethod").value,f=payFields(m),v={},err=$("payErr");
  for(var i=0;i<f.length;i++){
    var val=($(f[i][0]).value||"").trim();
    if(!val&&f[i][2]!=="opt"){err.textContent=t("pay_err");err.hidden=false;return}
    v[f[i][0]]=val;
  }
  var label;
  if(m==="paypal"){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.pf1)){err.textContent=t("pay_bad");err.hidden=false;return}
    label="PayPal · "+head(v.pf1.split("@")[0],1)+"***@"+v.pf1.split("@")[1];
  }else if(m==="card"){
    var d=v.pf2.replace(/\D/g,"");
    if(d.length<13||d.length>19){err.textContent=t("pay_bad");err.hidden=false;return}
    label=t("pay_card").split(" (")[0]+" · •••• "+tail(d,4)+" · "+v.pf1;
  }else if(m==="bank"){
    if(!/^[A-Za-z0-9 ]{15,40}$/.test(v.pf2)){err.textContent=t("pay_bad");err.hidden=false;return}
    label="IBAN "+head(v.pf2,4)+"…"+tail(v.pf2,4)+" · "+v.pf1+" · "+v.pf3;
  }else{
    if(v.pf3.length<14){err.textContent=t("pay_bad");err.hidden=false;return}
    label=v.pf1+" ("+v.pf2+") · "+head(v.pf3,4)+"…"+tail(v.pf3,4)+(v.pf4?" · memo":"");
  }
  err.hidden=true;S.prof.payMethod=m;S.prof.pay={label:label};save();renderPay();
}

function route(){
  var parts=(location.hash||"#home").slice(1).split("?"),v=parts[0];
  if(parts[1]&&parts[1].indexOf("denied")>=0)$("suNote").hidden=false;
  if(parts[1]&&parts[1].indexOf("taken")>=0){$("linkErr").textContent=t("taken_err");$("linkErr").hidden=false}
  if(parts[1]&&parts[1].indexOf("mismatch")>=0){$("linkErr").textContent=t("mm_err");$("linkErr").hidden=false}
  if(VIEWS.indexOf(v)<0)v="home";
  if(LIVE){if(v==="producer")roleSet("producer");else if(["signup","dashboard","campaigns","analysis","report","tiktok"].indexOf(v)>=0)roleSet("editor")}
  var g=gate();
  if((v==="dashboard"||v==="report")&&g)v=g;
  if(v==="tiktok"&&!termsOk())v="signup";
  if(v==="analysis"&&g==="signup")v="signup";
  var sec=v;if(v==="producer")sec="lprod";else if(LIVE&&v==="home")sec="lhome";else if(LIVE&&v==="campaigns")sec="lcamps";
  document.querySelectorAll(".view").forEach(function(s){s.classList.toggle("on",s.id==="v-"+sec)});
  document.querySelectorAll("nav .lnk").forEach(function(b){b.removeAttribute("aria-current");if(b.getAttribute("data-go")===v)b.setAttribute("aria-current","page")});
  if(location.hash!=="#"+v&&(location.hash||v!=="home")){try{history.replaceState(null,"","#"+v)}catch(err){}}
  if(v==="signup"){var add=S.accounts.length>0;$("fTerms").closest("label").hidden=add;$("openTT").disabled=!termsOk();$("suTitle").textContent=add?t("acc_add_title"):t("su_title")}
  navRole();
  runId++;
  if(v==="analysis")renderAnalysis();
  if(v==="report")renderReport();
  if(v==="producer")renderLProd();
  if(LIVE&&v==="home")renderLHome();
  if(LIVE&&v==="campaigns")renderLCamps();
  if(v==="campaigns"&&!LIVE){renderChips();renderCamps()}
  if(v==="dashboard"){renderDash();if(LIVE)refreshMe().then(loadReqs).then(renderDash)}
  if(v==="admin")renderAdmin();
  window.scrollTo(0,0);
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-go],[data-f],[data-req],[data-sub],[data-ap],[data-rj],[data-vw],[data-done],[data-back],#openTT,#ttAllow,#ttCancel,#sendReview,#changePrice,#changePrice2,#reanalyze,#otherAcc,#addAcc,#delAcc,#delYes,#delNo,#paySave,#withdraw,[data-adok],[data-adrej],#admLogin,#admLogout");
  if(!el)return;
  var id=el.id;
  if(el.hasAttribute("data-go")){go(el.getAttribute("data-go"));return}
  if(el.hasAttribute("data-f")){filter=el.getAttribute("data-f");renderChips();renderCamps();return}
  if(id==="openTT"){
    if(!termsOk())return;
    $("linkErr").hidden=true;pendingHandle="";
    if(LIVE){location.href="/auth/tiktok";return}
    $("ttAcct").textContent=t("tt_as")+" @demo_"+scn;go("tiktok");return}
  if(id==="ttCancel"){$("suNote").hidden=false;go("signup");return}
  if(id==="ttAllow"){
    var sel=document.querySelector('input[name="scn"]:checked');scn=sel?sel.value:"active";
    S.accounts.push({id:String(Date.now()),handle:"@"+(pendingHandle||"demo_"+scn),scenario:scn,consent:true,videos:genVideos(scn,Date.now()),analyzed:false,reviewed:false,price:null});
    S.active=S.accounts.length-1;sync();save();applyStatic();go("analysis");return}
  if(id==="otherAcc"){if(LIVE&&S.user)apiDelete(S.user);removeAccount(S.active);applyStatic();go("signup");return}
  if(id==="sendReview"){
    var pv=Number(String($("priceIn").value).replace(",","."));
    if(!(pv>=1&&pv<=200)){$("priceErr").hidden=false;return}
    var pr2=Math.round(pv*100)/100;
    if(LIVE){fetch("/api/price",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:S.user.id,price:pr2})}).then(function(r){if(!r.ok)throw 0;S.user.price=pr2;S.user.reviewed=true;save();go("report")}).catch(function(){$("priceErr").textContent=t("live_err");$("priceErr").hidden=false});return}
    S.user.price=pr2;S.user.reviewed=true;save();go("report");return}
  if(id==="changePrice"||id==="changePrice2"){S.user.reviewed=false;save();go("analysis");return}
  if(id==="reanalyze"){
    if(LIVE){fetch("/api/reanalyze",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:S.user.id})}).then(function(r){return r.json()}).then(function(d){S.user.videos=d.videos||[];S.user.analyzed=false;save();go("analysis")}).catch(function(){});return}
    S.user.analyzed=false;S.user.videos=genVideos(S.user.scenario,Date.now());save();go("analysis");return}
  if(el.hasAttribute("data-req")){
    var gt=gate();if(gt){go(gt);return}
    var cid=+el.getAttribute("data-req");
    if(S.orders.some(function(o){return o.id===cid}))return;
    S.orders.push({id:cid,price:S.user.price,avg:getA().refAvg,status:"pending",acc:S.user.handle,at:Date.now(),reqAt:Date.now()});
    save();renderCamps();return}
  if(el.hasAttribute("data-sub")){
    var i=+el.getAttribute("data-sub"),val=($("lk"+i).value||"").trim();
    if(!/^https?:\/\/\S+\.\S+/.test(val)){$("lkErr"+i).hidden=false;return}
    S.orders[i].status="submitted";S.orders[i].link=val;S.orders[i].returned=false;save();renderDash();return}
  if(id==="addAcc"){go("signup");return}
  if(id==="delAcc"){delAsk=true;delMsg="";renderDash();return}
  if(id==="delNo"){delAsk=false;renderDash();return}
  if(id==="delYes"){
    var da=S.user;
    if(S.orders.some(function(o){return o.acc===da.handle&&(o.status==="approved"||o.status==="submitted")})){delAsk=false;delMsg=t("acc_del_blocked");renderDash();return}
    if(LIVE)apiDelete(da);
    removeAccount(S.active);delAsk=false;delMsg="";applyStatic();
    if(S.user)renderDash();else go("home");return}
  if(id==="paySave"){savePay();return}
  if(id==="withdraw"){
    var b=balance();if(b<=0||!S.prof.pay)return;
    S.history.push({amount:b,at:Date.now(),label:S.prof.pay.label});save();renderDash();return}
  if(el.hasAttribute("data-adok")&&LIVE){admDecide(+el.getAttribute("data-adok"),"approved");return}
  if(el.hasAttribute("data-adrej")&&LIVE){admDecide(+el.getAttribute("data-adrej"),"rejected");return}
  if(id==="admLogin"){var pw=$("admPw").value;fetch("/api/admin/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})}).then(function(r){ADM.bad=!r.ok;return r.ok?admLoad():0}).then(renderAdminLive).catch(function(){ADM.bad=true;renderAdminLive()});return}
  if(id==="admLogout"){fetch("/api/admin/logout",{method:"POST",credentials:"same-origin"}).then(function(){ADM.ok=false;ADM.list=[];ADM.bad=false;renderAdminLive()});return}
  if(el.hasAttribute("data-adok")){S.accounts[+el.getAttribute("data-adok")].adminStatus="approved";save();renderAdmin();return}
  if(el.hasAttribute("data-adrej")){S.accounts[+el.getAttribute("data-adrej")].adminStatus="rejected";save();renderAdmin();return}
  if(el.hasAttribute("data-ap")){var o=S.orders[+el.getAttribute("data-ap")];o.status="approved";o.at=Date.now();save();renderAdmin();return}
  if(el.hasAttribute("data-rj")){S.orders[+el.getAttribute("data-rj")].status="rejected";save();renderAdmin();return}
  if(el.hasAttribute("data-vw")){var o2=S.orders[+el.getAttribute("data-vw")];o2.views=Math.round(o2.avg*(0.55+Math.random()*0.8));save();renderAdmin();return}
  if(el.hasAttribute("data-done")){S.orders[+el.getAttribute("data-done")].status="completed";save();renderAdmin();return}
  if(el.hasAttribute("data-back")){var o3=S.orders[+el.getAttribute("data-back")];o3.status="approved";o3.returned=true;o3.link="";save();renderAdmin();return}
});

function tlHtml(q){
  if(q.status==="rejected"||q.status==="cancelled")return '<div class="note err">'+esc(L("tl_rej"))+'</div>';
  var cur=0;
  if(q.status==="approved"||q.status==="returned")cur=1;
  else if(q.status==="submitted")cur=2;
  else if(q.status==="completed")cur=q.paid?5:4;
  var steps=["tl_sent","tl_ok","tl_link","tl_acc","tl_way","tl_paid"];
  var html='<ol class="tl">'+steps.map(function(k,i){
    var st=i<cur||(q.paid&&i===5)?"done":(i===cur?"cur":"todo");
    var extra="";
    if(i===4&&st==="cur"&&q.eta)extra='<small>'+esc(L("tl_eta"))+': '+esc(q.eta)+'</small>';
    if(i===5&&q.paid&&q.hasProof)extra='<small><a href="#" data-l="showProof" data-id="'+esc(q.id)+'">'+esc(L("tl_proof"))+'</a></small>';
    if(i===1&&st==="cur"&&q.eta)extra='<small>'+esc(L("tl_eta"))+': '+esc(q.eta)+'</small>';
    return '<li class="'+st+'"><span>'+esc(L(k))+'</span>'+extra+'</li>';
  }).join("")+'</ol>';
  if(q.status==="returned")html+='<div class="note err">'+esc(L("tl_ret"))+'</div>';
  if(q.overdue)html+='<div class="note err">'+esc(L("tl_overdue"))+'</div>';
  return html;
}
function shrinkImage(file,cb){

  fr.onerror=function(){cb(null)};fr.readAsDataURL(file);
}

    function tone(f,st,d,type,v){var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.0001,t0+st);g.gain.exponentialRampToValueAtTime(v||0.25,t0+st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+st+d);o.start(t0+st);o.stop(t0+st+d+0.05)}
    if(k==="ping")tone(880,0,0.35);
    if(k==="chime"){tone(660,0,0.4);tone(990,0.18,0.5)}
    if(k==="bell"){tone(523,0,1.1,"sine",.2);tone(1046,0,0.9,"sine",.12);tone(1568,0,0.6,"sine",.08)}
    if(k==="drum"){var o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,t0);o.frequency.exponentialRampToValueAtTime(50,t0+0.25);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.6,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);o.start();o.stop(t0+0.35)}

/* ---- animated account breakdown (replaces the plain table) ---- */
function clamp01(v){return Math.max(0,Math.min(1,v))}
function breakdown(A,u){
  var vids=((u&&u.videos)||[]).filter(function(v){return v.created>=Date.now()-30*86400000}).sort(function(a,b){return a.created-b.created}).slice(-30);
  var perWeek=A.month.videos/(30/7),avg=A.refAvg||0;
  var above=vids.length?vids.filter(function(v){return v.views>=10000}).length/vids.length:0;
  var tv=0,tl=0,hasL=false;vids.forEach(function(v){tv+=v.views;if(v.likes!=null&&v.likes>0)hasL=true;tl+=v.likes||0});
  var likeP=hasL&&tv?tl/tv*100:null,price=u&&u.price,cpm=price&&avg?price/avg*1000:null;
  var parts=[
    {k:"cr_views",w:30,v:clamp01(Math.log(Math.max(avg,1)/1000)/Math.log(30)),txt:n(avg)},
    {k:"cr_stable",w:27,v:above,txt:Math.round(above*100)+"% ≥ 10K"},
    {k:"cr_price",w:21,v:cpm===null?0.5:clamp01((0.15-cpm)/0.11),txt:cpm===null?"—":"$"+cpm.toFixed(2)+" / 1K"},
    {k:"cr_freq",w:12,v:clamp01(perWeek/7),txt:perWeek.toFixed(1)+" / "+L("an_week")},
    {k:"cr_fresh",w:10,v:A.lastDaysAgo===null?0:clamp01(1-A.lastDaysAgo/7),txt:A.lastDaysAgo===null?"—":(A.lastDaysAgo===0?L("an_today"):L("an_ago").replace("{n}",A.lastDaysAgo))}];
  var score=Math.round(parts.reduce(function(s,p){return s+p.w*p.v},0));
  return {vids:vids,perWeek:perWeek,avg:avg,likeP:likeP,parts:parts,score:score};
}
function winTable(A,u){
  var B=breakdown(A,u),col=B.score>=70?"#1FA85A":(B.score>=40?"#E8A91E":"#D8445A"),C=2*Math.PI*52;
  var last=A.lastDaysAgo===null?"—":(A.lastDaysAgo===0?L("an_today"):L("an_ago").replace("{n}",A.lastDaysAgo));
  var mx=Math.max.apply(null,B.vids.map(function(v){return v.views}).concat([10000])),lineY=10000/mx*100;
  var bars=B.vids.map(function(v,i){var h=Math.max(4,v.views/mx*100);return '<i class="'+(v.views>=10000?'':'lo')+'" style="--h:'+h+'%;animation-delay:'+(i*0.03)+'s" title="'+esc(fmtDate(v.created)+" · "+n(v.views))+'"></i>'}).join("");
  return '<div class="acard"><div class="achead"><b>'+esc(L("an_title"))+'</b><button type="button" class="algob" data-l="algoToggle">'+esc(L("an_algo"))+' ›</button></div>'+
   '<div class="acmain"><div class="ring" data-s="'+B.score+'" style="--c:'+col+'"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rbg"/><circle cx="60" cy="60" r="52" class="rfg" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-c="'+C.toFixed(1)+'"/></svg><div class="rnum"><b>0</b><small>'+esc(L("an_of"))+'</small></div></div>'+
   '<div class="acrows"><div><span>'+esc(L("an_freq"))+'</span><b>'+B.perWeek.toFixed(B.perWeek<10?1:0)+' '+esc(L("an_week"))+'</b></div><div><span>'+esc(L("an_views"))+'</span><b>'+n(B.avg)+'</b></div>'+(B.likeP!==null&&B.likeP>=0.1?'<div><span>'+esc(L("an_likes"))+'</span><b>'+B.likeP.toFixed(1)+'%</b></div>':'')+'<div><span>'+esc(L("an_last"))+'</span><b>'+esc(last)+'</b></div></div></div>'+
   '<div class="abars">'+(bars||'<div class="hint">'+esc(t("v_none"))+'</div>')+(bars?'<span class="aline" style="bottom:'+lineY.toFixed(1)+'%"><em>10K</em></span>':'')+'</div>'+
   '<p class="hint">'+esc(L("an_checked"))+'</p>'+
   '<div class="algo" hidden><h4>'+esc(L("an_algo"))+'</h4><p class="hint">'+esc(L("an_algo_h"))+'</p>'+B.parts.map(function(p){return '<div class="cr"><div><span>'+esc(L(p.k))+' · '+p.w+'%</span><b>'+esc(p.txt)+'</b></div><div class="crbar"><i style="--w:'+Math.round(p.v*100)+'%"></i></div></div>'}).join("")+'</div></div>';
}
function animRings(){
  document.querySelectorAll(".ring:not([data-d])").forEach(function(r){
    r.setAttribute("data-d","1");var s=Number(r.getAttribute("data-s")),fg=r.querySelector(".rfg"),C=Number(fg.getAttribute("data-c")),num=r.querySelector(".rnum b"),t0=null;

    requestAnimationFrame(step);
  });
}
